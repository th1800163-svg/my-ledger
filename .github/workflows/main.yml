name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install SQLite for tests
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev

      - name: Prepare project
        shell: bash
        run: |
          ZIP=$(ls amar_hisab_part*.zip | sort | tail -n 1)
          echo "Using $ZIP"
          flutter create --platforms=android --org com.amarhisab --project-name amar_hisab app
          unzip -q -o "$ZIP" -d unzipped
          cp -r unzipped/amar_hisab/. app/
          if [ -d assets ]; then cp -r assets app/; fi
          rm -f app/test/widget_test.dart

      - name: Get packages
        working-directory: app
        shell: bash
        run: flutter pub get 2>&1 | tee pub-log.txt

      - name: Run tests
        working-directory: app
        shell: bash
        run: flutter test --reporter expanded 2>&1 | tee test-log.txt

      - name: Build APK
        if: ${{ !cancelled() }}
        working-directory: app
        shell: bash
        run: flutter build apk --release 2>&1 | tee build-log.txt

      - name: Save logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: app/*-log.txt
          retention-days: 7

      - name: Save APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: ignore
